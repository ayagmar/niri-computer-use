[workspace]
members = ["harness"]
default-members = [".", "harness"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[package]
name = "niri-computer-use"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
elided_lifetimes_in_paths = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "warn"
string_slice = "warn"
exit = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
wildcard_enum_match_arm = "warn"
rc_mutex = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
shadow_unrelated = "warn"
same_name_method = "warn"
mod_module_files = "warn"
cognitive_complexity = "warn"
str_to_string = "warn"
rest_pat_in_fully_bound_structs = "warn"
unneeded_field_pattern = "warn"
clone_on_ref_ptr = "warn"
large_futures = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
verbose_file_reads = "warn"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
redundant_pub_crate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
panic = "unwind"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
niri-ipc = "=26.4.0"
rmcp = { version = "3.5.0", features = ["transport-io"] }
rustix = { version = "1.1.5", features = ["fs", "process", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync", "process"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
xkbcommon = { version = "0.9.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["test-util"] }
