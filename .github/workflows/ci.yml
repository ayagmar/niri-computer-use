name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gate tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos-cli@1.50.3,shellcheck@0.11.0

      - name: Install libxkbcommon and dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev dbus-daemon

      - name: Restore cargo's build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run checks
        run: make check

  stall:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libxkbcommon and dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev dbus-daemon

      - name: Restore cargo's build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: stall
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Explore every stall point
        run: make stall

  site:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build the site
        working-directory: site
        run: |
          npm ci
          npm run build
