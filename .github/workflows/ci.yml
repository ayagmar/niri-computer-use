name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gate tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos-cli@1.50.3,shellcheck@0.11.0

      - name: Run checks
        run: make check
