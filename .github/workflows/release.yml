name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the tagged commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the tag names, also when the tag is annotated.
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$commit" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "$GITHUB_REF_NAME ($commit) isn't on main: compare says $status" >&2
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Install libxkbcommon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev

      - name: Check the tag against the crate's version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "niri-computer-use") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the crate's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --locked --release -p niri-computer-use --target x86_64-unknown-linux-gnu

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="niri-computer-use-$VERSION-x86_64-linux"
          mkdir -p "dist/$name/skills"
          cp target/x86_64-unknown-linux-gnu/release/niri-computer-use README.md LICENSE CHANGELOG.md "dist/$name/"
          strip --strip-debug "dist/$name/niri-computer-use"
          cp -r skills/niri-computer-use "dist/$name/skills/"
          cargo about generate --frozen -c .github/release/about.toml -m Cargo.toml \
            .github/release/licenses.hbs -o "dist/$name/THIRD-PARTY-LICENSES.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      - name: Hand the release files on
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/notes.md
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Take the release files
        uses: actions/download-artifact@v8.0.1
        with:
          name: release
          path: dist

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          name="niri-computer-use-$VERSION-x86_64-linux"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md \
            "dist/$name.tar.gz" "dist/$name.tar.gz.sha256"
