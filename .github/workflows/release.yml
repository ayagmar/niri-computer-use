name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the tagged commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the tag names, also when the tag is annotated.
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$commit" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "$GITHUB_REF_NAME ($commit) isn't on main: compare says $status" >&2
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-about
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2

      - name: Install libxkbcommon
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-dev

      - name: Check the tag against the crate's version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "niri-computer-use") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match the crate's version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: cargo build --locked --release -p niri-computer-use --target "$ARCH-unknown-linux-gnu"

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          target="$ARCH-unknown-linux-gnu"
          name="niri-computer-use-$VERSION-$ARCH-linux"
          mkdir -p "dist/$name/skills"
          cp "target/$target/release/niri-computer-use" README.md LICENSE CHANGELOG.md "dist/$name/"
          strip --strip-debug "dist/$name/niri-computer-use"
          "dist/$name/niri-computer-use" --version
          cp -r skills/niri-computer-use "dist/$name/skills/"
          mkdir -p "dist/$name/noctalia"
          cp -r noctalia/niri-computer-use "dist/$name/noctalia/"
          rm -rf "dist/$name/noctalia/niri-computer-use/tests"
          # cargo-about reads every platform's crates, and the build fetched only this one's.
          cargo fetch --locked
          cargo about generate --frozen --target "$target" -c .github/release/about.toml -m Cargo.toml \
            .github/release/licenses.hbs -o "dist/$name/THIRD-PARTY-LICENSES.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          cp install.sh dist/

      - name: Hand the tarball on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Hand the notes and the install script on
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: |
            dist/notes.md
            dist/install.sh
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Take the release files
        timeout-minutes: 5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create a draft release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          name="niri-computer-use-$VERSION"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file dist/notes.md \
            "dist/$name-x86_64-linux.tar.gz" "dist/$name-x86_64-linux.tar.gz.sha256" \
            "dist/$name-aarch64-linux.tar.gz" "dist/$name-aarch64-linux.tar.gz.sha256" \
            dist/install.sh
